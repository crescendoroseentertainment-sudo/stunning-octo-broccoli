name: Deploy to Vercel

# Deploys this repo to the crescendorosesite-2 project (www.crescendorose.com).
# Pushes to the production branch go live; pushes to any other branch get a
# preview URL. Needs a VERCEL_TOKEN repository secret scoped to the
# crescendo rose team.

on:
  push:
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_dgNIQRoFGNcRHoWUVFbBKfn9
  VERCEL_PROJECT_ID: prj_wSH42KKgbrqRh58gBKYLFUkLHDiC
  PRODUCTION_BRANCH: claude/setup-mcp-servers-forsja

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pick environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "${PRODUCTION_BRANCH}" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "prod=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
            echo "prod=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull project settings
        run: vercel pull --yes --environment=${{ steps.env.outputs.target }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build ${{ steps.env.outputs.prod }} --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.env.outputs.prod }} --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed: $url" | tee -a "$GITHUB_STEP_SUMMARY"
